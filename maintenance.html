<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>طلبات الصيانة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>console.log = function() {}; console.info = function() {};</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
    :root {
      --primary: #d84315;
      --primary-hover: #bf360c;
      --primary-light: #fbe9e7;
      --danger: #ef4444;
      --success: #22c55e;
      --info: #3b82f6;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --border-radius-lg: 24px;
      --border-radius-md: 16px;
      --border-radius-sm: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --font-family: 'Tajawal', sans-serif;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased; background-image: radial-gradient(circle at top right, #ffedd5 0%, transparent 40%), radial-gradient(circle at bottom left, #e0f2fe 0%, transparent 40%); background-attachment: fixed; }
    .page-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 1.5rem 2rem; position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; box-shadow: var(--shadow-sm); }
    .page-header h1 { font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.25rem; color: var(--primary); }
    .page-header .subtitle { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); margin-bottom: 1rem; }
    .header-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .header-actions button, .header-actions a button { background: white; color: var(--text-main); border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 9999px; cursor: pointer; font-family: var(--font-family); font-size: 0.95rem; font-weight: 600; transition: var(--transition); box-shadow: var(--shadow-sm); text-decoration: none; }
    .header-actions button:hover { border-color: var(--text-muted); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; }
    .auth-required { text-align: center; padding: 4rem 2rem; background: var(--card-bg); border-radius: var(--border-radius-lg); box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
    .auth-required .icon { font-size: 4rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    .auth-required h2 { color: var(--text-main); margin-bottom: 0.5rem; font-weight: 800; font-size: 1.5rem; }
    .auth-required p { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.05rem; }
    .auth-required button { background: var(--primary); color: white; border: none; padding: 0.8rem 2rem; border-radius: 9999px; font-size: 1.1rem; font-weight: 700; cursor: pointer; font-family: var(--font-family); transition: var(--transition); box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3); }
    .auth-required button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4); }
    .form-card { background: var(--card-bg); border-radius: var(--border-radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg); margin-bottom: 3rem; border: 1px solid var(--border-color); position: relative; overflow: hidden; }
    .form-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), #ff7043); }
    .form-card h2 { color: var(--text-main); font-size: 1.4rem; font-weight: 800; margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 700; color: var(--text-main); font-size: 0.95rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.8rem 1rem; border: 2px solid var(--border-color); border-radius: var(--border-radius-md); font-family: var(--font-family); font-size: 1rem; color: var(--text-main); transition: var(--transition); background: var(--bg-color); }
    .form-group input::placeholder, .form-group textarea::placeholder { color: #94a3b8; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); background: #ffffff; }
    .form-group textarea { min-height: 120px; resize: vertical; }
    .image-upload-area { border: 2px dashed #cbd5e1; border-radius: var(--border-radius-md); padding: 2rem 1.5rem; text-align: center; cursor: pointer; transition: var(--transition); background: var(--bg-color); }
    .image-upload-area:hover, .image-upload-area.dragover { border-color: var(--primary); background: var(--primary-light); }
    .image-upload-area .upload-icon { font-size: 2.5em; margin-bottom: 0.5rem; }
    .image-upload-area p { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }
    .image-previews { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 1rem; }
    .image-preview { position: relative; width: 100px; height: 100px; border-radius: var(--border-radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
    .image-preview img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .image-preview:hover img { transform: scale(1.05); }
    .image-preview .remove-img { position: absolute; top: 6px; left: 6px; background: rgba(239, 68, 68, 0.9); color: white; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); }
    .image-preview:hover .remove-img { opacity: 1; }
    .submit-btn { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; border: none; padding: 1rem 2rem; border-radius: var(--border-radius-md); font-size: 1.1rem; font-weight: 800; cursor: pointer; font-family: var(--font-family); width: 100%; transition: var(--transition); box-shadow: 0 4px 14px rgba(249, 115, 22, 0.25); }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35); }
    .submit-btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .section-title h2 { color: var(--text-main); font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { background: var(--card-bg); border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 9999px; cursor: pointer; font-size: 0.9rem; font-family: var(--font-family); font-weight: 600; color: var(--text-muted); transition: var(--transition); box-shadow: var(--shadow-sm); }
    .chip.active { background: var(--text-main); color: white; border-color: var(--text-main); }
    .chip:hover:not(.active) { border-color: var(--text-muted); color: var(--text-main); }
    .request-card { background: var(--card-bg); border-radius: var(--border-radius-md); padding: 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); border-right: 4px solid var(--border-color); transition: var(--transition); }
    .request-card[data-priority="عالية جداً"] { border-right-color: var(--danger); }
    .request-card[data-priority="عالية"] { border-right-color: var(--primary); }
    .request-card[data-priority="متوسطة"] { border-right-color: #facc15; }
    .request-card[data-priority="عادية"] { border-right-color: var(--success); }
    .request-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #cbd5e1; }
    .request-card .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; gap: 1rem; }
    .request-card .card-title { font-weight: 800; font-size: 1.15rem; color: var(--text-main); line-height: 1.4; }
    .status-badge { padding: 0.35rem 0.8rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; }
    .status-new { background: #fee2e2; color: #b91c1c; }
    .status-in-progress { background: #e0f2fe; color: #0369a1; }
    .status-resolved { background: #dcfce7; color: #15803d; }
    .request-card .card-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1rem; background: var(--bg-color); padding: 1rem; border-radius: var(--border-radius-sm); border: 1px solid var(--border-color); }
    .request-card .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #94a3b8; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); }
    .card-meta span { display: flex; align-items: center; gap: 5px; }
    .card-images { display: flex; gap: 10px; margin-top: 1rem; flex-wrap: wrap; }
    .card-images img { width: 70px; height: 70px; object-fit: cover; border-radius: var(--border-radius-sm); cursor: pointer; transition: var(--transition); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
    .card-images img:hover { transform: scale(1.05); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .empty-state { text-align: center; padding: 4rem 2rem; background: var(--card-bg); border-radius: var(--border-radius-lg); border: 1px dashed #cbd5e1; color: var(--text-muted); }
    .empty-state .icon { font-size: 3.5rem; margin-bottom: 1rem; opacity: 0.8; }
    .empty-state p { font-size: 1.1rem; font-weight: 500;}
    .image-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); z-index: 5000; justify-content: center; align-items: center; cursor: zoom-out; opacity: 0; animation: fadeIn 0.3s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    .image-viewer img { max-width: 90vw; max-height: 90vh; border-radius: var(--border-radius-md); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); object-fit: contain; animation: scaleIn 0.3s forwards; }
    @keyframes scaleIn { from { transform: scale(0.9); } to { transform: scale(1); } }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 3000; opacity: 0; animation: fadeIn 0.2s forwards; }
    .modal-box { background: var(--card-bg); padding: 2.5rem 2rem; border-radius: var(--border-radius-lg); width: 90%; max-width: 360px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color); animation: slideUp 0.3s forwards; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-box h3 { color: var(--text-main); margin-bottom: 0.5rem; font-size: 1.4rem; font-weight: 800; }
    .modal-box input { width: 100%; padding: 0.8rem 1rem; margin-bottom: 1rem; border: 2px solid var(--border-color); border-radius: var(--border-radius-md); font-family: var(--font-family); font-size: 1rem; transition: var(--transition); background: var(--bg-color); }
    .modal-box input:focus { outline: none; border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px var(--primary-light); }
    .modal-box .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 0.5rem; }
    .modal-box button { padding: 0.8rem; border: none; border-radius: var(--border-radius-md); cursor: pointer; font-family: var(--font-family); font-weight: 700; font-size: 1rem; transition: var(--transition); width: 100%; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text-main); color: white; padding: 1rem 1.5rem; border-radius: 9999px; font-family: var(--font-family); font-weight: 600; font-size: 0.95rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); z-index: 9999; transition: transform 0.4s; display: flex; align-items: center; gap: 10px; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s infinite; vertical-align: middle; margin-inline-end: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) { .page-header { padding: 1rem; } .container { padding: 0 1rem; margin: 1rem auto; } .form-card { padding: 1.5rem; } .section-title { flex-direction: column; gap: 1rem; align-items: flex-start; } .request-card .card-header { flex-direction: column; gap: 5px; } .status-badge { align-self: flex-start; } .filter-chips { overflow-x: auto; padding-bottom: 5px; width: 100%; flex-wrap: nowrap;} .chip { white-space: nowrap; } }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="page-header">
    <h1>🔧 طلبات الصيانة</h1>
    <div class="subtitle" id="userMallDisplay"></div>
    <div class="header-actions">
      <a href="index.html"><button>📦 العودة لجدول البضاعة</button></a>
      <button id="loginBtn" onclick="login()">🔑 تسجيل الدخول</button>
    </div>
  </div>

  <div class="container">

    <!-- Auth Required Screen -->
    <div id="authRequired" class="auth-required">
      <div class="icon">🔒</div>
      <h2>يرجى تسجيل الدخول</h2>
      <p>لإنشاء ومتابعة طلبات الصيانة، تحتاج لتسجيل الدخول بحسابك أولاً</p>
      <button onclick="login()">🔑 تسجيل الدخول</button>
    </div>

    <!-- Main Content (hidden until auth) -->
    <div id="mainContent" style="display:none;">

      <!-- New Request Form -->
      <div class="form-card">
        <h2>📝 طلب صيانة جديد</h2>

        <div class="form-group">
          <label>عنوان المشكلة *</label>
          <input type="text" id="reqTitle" placeholder="مثال: تعطل جهاز التكييف...">
        </div>

        <div class="form-group">
          <label>وصف المشكلة وتفاصيلها</label>
          <textarea id="reqDescription" placeholder="اشرح المشكلة بالتفصيل: متى بدأت، ما الأعراض، أي معلومات إضافية..."></textarea>
        </div>

        <div class="form-group">
          <label>أولوية الطلب</label>
          <select id="reqPriority">
            <option value="عالية جداً">🔴 عالية جداً (طارئ)</option>
            <option value="عالية">🟠 عالية</option>
            <option value="متوسطة">🟡 متوسطة</option>
            <option value="عادية" selected>🟢 عادية</option>
          </select>
        </div>

        <div class="form-group">
          <label>صور (اختياري)</label>
          <div class="image-upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📸</div>
            <p>اضغط هنا أو اسحب الصور لرفعها</p>
            <p style="font-size:0.8em; color:#bbb; margin-top:5px;">يدعم JPG, PNG, WEBP - حد أقصى 5 صور</p>
          </div>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
          <div class="image-previews" id="imagePreviews"></div>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="submitRequest()">
          📤 إرسال الطلب
        </button>
      </div>

      <!-- Existing Requests -->
      <div class="section-title">
        <h2>📋 طلباتي السابقة</h2>
        <div class="filter-chips">
          <div class="chip active" onclick="filterRequests('all', this)">الكل</div>
          <div class="chip" onclick="filterRequests('جديد', this)">🟠 جديد</div>
          <div class="chip" onclick="filterRequests('قيد المعالجة', this)">🔵 قيد المعالجة</div>
          <div class="chip" onclick="filterRequests('تم الحل', this)">🟢 تم الحل</div>
        </div>
      </div>

      <div id="requestsList"></div>
    </div>
  </div>

  <!-- Image Viewer -->
  <div class="image-viewer" id="imageViewer" onclick="this.style.display='none'">
    <img id="viewerImage" src="" alt="صورة مكبرة">
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <h3>🔑 تسجيل الدخول</h3>
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني">
      <input id="passwordInput" type="password" placeholder="كلمة المرور">
      <div class="btn-row">
        <button onclick="confirmLogin()" style="background:var(--primary); color:white;">دخول</button>
        <button onclick="closeLoginModal()" style="background:transparent; color:var(--text-muted); border:1px solid var(--border-color);">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // === Supabase Setup (same as index.html) ===
    const SUPABASE_URL = "https://sufeqdvooqkolghflhta.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1ZmVxZHZvb3Frb2xnaGZsaHRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MTY5OTIsImV4cCI6MjA4ODk5Mjk5Mn0.ody4a53OtJqzLIoTvJ3S6Igdue-Sy4HsUQ_Cz7MUSjY";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    });

    let currentUser = null;
    let userMall = "";
    let allRequests = [];
    let currentFilter = 'all';
    let selectedFiles = [];

    // === Auth Logic ===
    async function handleAuthUser(user) {
      currentUser = user;

      const loginBtn = document.getElementById('loginBtn');
      const authReq = document.getElementById('authRequired');
      const mainContent = document.getElementById('mainContent');
      const mallDisplay = document.getElementById('userMallDisplay');

      if (user) {
        loginBtn.textContent = '🚪 تسجيل الخروج';

        // Fetch profile
        let profile = null;
        try {
          let res = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
          if (res.error) {
            res = await supabaseClient.from('profiles').select('*').eq('email', user.email).single();
          }
          profile = res.data;
        } catch(e) {}

        userMall = profile?.mall || '';
        mallDisplay.textContent = userMall ? `المعرض: ${userMall}` : '';

        authReq.style.display = 'none';
        mainContent.style.display = 'block';
        loadRequests();
      } else {
        loginBtn.textContent = '🔑 تسجيل الدخول';
        authReq.style.display = 'block';
        mainContent.style.display = 'none';
        mallDisplay.textContent = '';
      }
    }

    // Init auth
    (async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        await handleAuthUser(session?.user || null);

        supabaseClient.auth.onAuthStateChange(async (event, newSession) => {
          if (event === 'INITIAL_SESSION') return;
          if (event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'USER_DELETED') {
            await handleAuthUser(newSession?.user || null);
          }
        });
      } catch(e) {
        console.error("Auth init error:", e);
      }
    })();

    async function login() {
      if (currentUser) {
        await supabaseClient.auth.signOut();
        localStorage.removeItem('savedEmail');
        localStorage.removeItem('savedPassword');
      } else {
        document.getElementById('loginModal').style.display = 'flex';
        const se = localStorage.getItem('savedEmail');
        const sp = localStorage.getItem('savedPassword');
        if (se) document.getElementById('emailInput').value = se;
        if (sp) document.getElementById('passwordInput').value = sp;
      }
    }

    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

    async function confirmLogin() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      if (email && password) {
        localStorage.setItem('savedEmail', email);
        localStorage.setItem('savedPassword', password);
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          showToast('فشل الدخول: ' + error.message, 'error');
        } else {
          closeLoginModal();
        }
      } else {
        showToast('يرجى إدخال البريد وكلمة المرور', 'error');
      }
    }

    // === Image Upload ===
    const uploadArea = document.getElementById('uploadArea');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      const maxFiles = 5;
      for (let i = 0; i < files.length; i++) {
        if (selectedFiles.length >= maxFiles) {
          showToast(`الحد الأقصى ${maxFiles} صور`, 'error');
          break;
        }
        if (files[i].type.startsWith('image/')) {
          selectedFiles.push(files[i]);
        }
      }
      renderPreviews();
    }

    function renderPreviews() {
      const container = document.getElementById('imagePreviews');
      container.innerHTML = selectedFiles.map((file, idx) => {
        const url = URL.createObjectURL(file);
        return `
          <div class="image-preview">
            <img src="${url}" alt="صورة ${idx + 1}">
            <button class="remove-img" onclick="removeImage(${idx})">✕</button>
          </div>
        `;
      }).join('');
    }

    function removeImage(idx) {
      selectedFiles.splice(idx, 1);
      renderPreviews();
    }

    // === Submit Request ===
    async function submitRequest() {
      const title = document.getElementById('reqTitle').value.trim();
      const description = document.getElementById('reqDescription').value.trim();
      const priority = document.getElementById('reqPriority').value;
      const status = 'جديد';

      if (!title) {
        showToast('يرجى إدخال عنوان المشكلة', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> جاري الإرسال...';

      try {
        // Helper function to convert file to WebP
        const convertToWebP = (file) => {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = img.width;
              canvas.height = img.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              canvas.toBlob((blob) => {
                if (!blob) reject(new Error('Canvas is empty'));
                resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".webp", { type: 'image/webp' }));
              }, 'image/webp', 0.8); // 0.8 quality
            };
            img.onerror = reject;
            img.src = URL.createObjectURL(file);
          });
        };

        // Upload images
        let imageUrls = [];
        for (const file of selectedFiles) {
          try {
            const webpFile = await convertToWebP(file);
            const fileName = `${currentUser.id}/${Date.now()}_${Math.random().toString(36).substr(2, 9)}.webp`;

            const { error: uploadError } = await supabaseClient.storage
              .from('maintenance-images')
              .upload(fileName, webpFile);

            if (!uploadError) {
              const { data: urlData } = supabaseClient.storage
                .from('maintenance-images')
                .getPublicUrl(fileName);
              imageUrls.push(urlData.publicUrl);
            }
          } catch(err) {
            console.error('Image conversion/upload error:', err);
          }
        }

        // Insert request
        const { error } = await supabaseClient
          .from('maintenance_requests')
          .insert({
            user_id: currentUser.id,
            user_email: currentUser.email,
            mall: userMall || 'غير محدد',
            title: title,
            description: description,
            status: status,
            priority: priority,
            images: imageUrls
          });

        if (error) throw error;

        showToast('تم إرسال طلب الصيانة بنجاح ✅', 'success');

        // Reset form
        document.getElementById('reqTitle').value = '';
        document.getElementById('reqDescription').value = '';
        document.getElementById('reqPriority').value = 'عادية';
        selectedFiles = [];
        renderPreviews();
        loadRequests();

      } catch(e) {
        showToast('حدث خطأ: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '📤 إرسال الطلب';
      }
    }

    // === Load Requests ===
    async function loadRequests() {
      try {
        let query = supabaseClient
          .from('maintenance_requests')
          .select('*')
          .order('created_at', { ascending: false });
          
        if (userMall) {
          query = query.eq('mall', userMall);
        } else if (currentUser) {
          query = query.eq('user_id', currentUser.id);
        }

        const { data, error } = await query;

        if (error) throw error;
        allRequests = data || [];
        renderRequests();
      } catch(e) {
        document.getElementById('requestsList').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>حدث خطأ في تحميل الطلبات</p></div>';
      }
    }

    function filterRequests(filter, chipEl) {
      currentFilter = filter;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if (chipEl) chipEl.classList.add('active');
      renderRequests();
    }

    function renderRequests() {
      const container = document.getElementById('requestsList');
      let filtered = allRequests;

      if (currentFilter !== 'all') {
        filtered = allRequests.filter(r => r.status === currentFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>${currentFilter === 'all' ? 'لا توجد طلبات صيانة حالياً' : 'لا توجد طلبات بهذه الحالة'}</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(req => {
        const statusClass = req.status === 'جديد' ? 'status-new' :
                           req.status === 'قيد المعالجة' ? 'status-in-progress' : 'status-resolved';

        const date = new Date(req.created_at).toLocaleDateString('ar-SA', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });

        const imagesHtml = (req.images && req.images.length > 0)
          ? `<div class="card-images">${req.images.map(url =>
              `<img src="${url}" onclick="viewImage('${url}')" alt="صورة">`
            ).join('')}</div>`
          : '';

        return `
          <div class="request-card" data-priority="${escapeHtml(req.priority || 'عادية')}">
            <div class="card-header">
              <div class="card-title">${escapeHtml(req.title)}</div>
              <span class="status-badge ${statusClass}">${req.status}</span>
            </div>
            <div style="margin-bottom: 8px; font-size: 0.9em;">
              <strong>الأولوية: </strong> 
              <span style="color: ${req.priority === 'عالية جداً' ? 'var(--danger)' : req.priority === 'عالية' ? '#e67e22' : req.priority === 'متوسطة' ? '#f39c12' : 'var(--success)'}; font-weight: bold;">
                ${req.priority || 'عادية'}
              </span>
            </div>
            ${req.description ? `<div class="card-desc">${escapeHtml(req.description)}</div>` : ''}
            ${imagesHtml}
            ${req.admin_reply ? `
              <div style="margin-top: 15px; padding: 12px; background: #fdf6f0; border-right: 3px solid var(--primary); border-radius: 8px;">
                <div style="font-weight: bold; color: var(--primary-dark); font-size: 0.9em; margin-bottom: 5px;">👨‍🔧 رد الإدارة:</div>
                <div style="font-size: 0.9em; color: var(--text-main); margin-bottom: 8px; white-space: pre-wrap;">${escapeHtml(req.admin_reply)}</div>
                ${(req.admin_images && req.admin_images.length > 0) ? `
                  <div class="card-images">
                    ${req.admin_images.map(url => `<img src="${url}" onclick="viewImage('${url}')" alt="صورة رد الإدارة">`).join('')}
                  </div>
                ` : ''}
              </div>
            ` : ''}
            <div class="card-meta" style="margin-top: 10px;">
              <span>📅 ${date}</span>
              <span>📍 ${escapeHtml(req.mall)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function viewImage(url) {
      document.getElementById('viewerImage').src = url;
      document.getElementById('imageViewer').style.display = 'flex';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // === Toast ===
    function showToast(msg, type = '') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => { toast.className = 'toast'; }, 3500);
    }
  </script>

</body>
