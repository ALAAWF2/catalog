  <!-- first_seen.json + منطق "جديد" -->
  <script>
    const FIRST_SEEN_URL = "first_seen.json";
    const NEW_WINDOW_DAYS = 14;
    let FIRST_SEEN = {};

    async function loadFirstSeen() {
      try {
        const res = await fetch(FIRST_SEEN_URL + "?_=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        FIRST_SEEN = await res.json();
      } catch (e) {
        console.warn("تعذر تحميل first_seen.json:", e);
        FIRST_SEEN = {};
      }
    }
    function isNewArrival(code) {
      const fs = FIRST_SEEN?.[String(code)];
      if (!fs) return false;
      const fsDt = new Date(fs);
      const lastIso = document.getElementById("lastUpdated")?.dataset?.iso;
      const lastDt = lastIso ? new Date(lastIso) : new Date();
      const diffMs = lastDt - fsDt;
      const diffDays = diffMs / (1000 * 60 * 60 * 24);
      return diffDays >= 0 && diffDays <= NEW_WINDOW_DAYS;
    }
  </script>

  <script>
    async function loadLocalCatalog() {
      try {
        const productsRes = await fetch("products.json?_=" + Date.now(), { cache: "no-store" });
        if (!productsRes.ok) throw new Error("Failed to load products.json");
        window.products = await productsRes.json();
        console.log("✅ products.json loaded:", window.products.length);
      } catch (e) {
        console.error("❌ Catalog load failed:", e);
        window.products = [];
      }
    }
  </script>

  <!-- ✅ (جديد) تحميل مبيعات المعارض -->
  <script>
    async function loadSalesByOutlet() {
      try {
        const r = await fetch("sales_by_outlet.json?_=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("Failed to load sales_by_outlet.json");
        window.SALES_BY_OUTLET = await r.json();
        console.log("✅ sales_by_outlet.json loaded");
      } catch (e) {
        console.error("❌ sales_by_outlet.json load failed:", e);
        window.SALES_BY_OUTLET = {};
      }
    }

    // ✅ تطبيع اسم المعرض لتفادي اختلافات "-" / مسافات / كيس
    function normalizeKey(v) {
      return String(v ?? "")
        .toLowerCase()
        .replace(/[-_]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    // ✅ هذه الدالة هي الحل الحقيقي لمشكلة "0"
    function getSalesInMall(code) {
      const obj = window.SALES_BY_OUTLET?.[String(code)];
      if (!obj || !userMall) return 0;

      const target = normalizeKey(userMall);

      // محاولة مطابقة مباشرة بعد التطبيع
      for (const mallName in obj) {
        if (normalizeKey(mallName) === target) {
          return Number(obj[mallName]) || 0;
        }
      }
      return 0;
    }
  </script>

  <script>
function rebuildDataForWarehouse(warehouse) {
  if (!warehouse) {
    window.data = [];
    return;
  }

  const RAW = Array.isArray(window.products) ? window.products : [];
  const target = normalizeKey(warehouse);

  window.data = RAW
    .map(p => {
      if (!p.branches) return null;

      let warehouseStock = 0;

      for (const branch in p.branches) {
        if (normalizeKey(branch) === target) {
          warehouseStock = Number(p.branches[branch]) || 0;
        }
      }

      if (warehouseStock <= 0) return null;

      return {
        ...p,
        stock: warehouseStock // ✅ هنا الإصلاح
      };
    })
    .filter(Boolean);
}

  </script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDBhsMvDPwECDlFNYNkmFXDVq4nWrEejJc",
      authDomain: "orders-fb3bf.firebaseapp.com",
      projectId: "orders-fb3bf",
      storageBucket: "orders-fb3bf.firebasestorage.app",
      messagingSenderId: "970674722848",
      appId: "1:970674722848:web:e2e17f7a62bf59e51f0445"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let userWarehouse = "";
    let userMall = "";
    let cart = {};
    let logoutTimer;
    let submitting = false;

    const productsPerPage = 40;
    let filteredProducts = [], currentPage = 1;

    auth.onAuthStateChanged(async user => {
      currentUser = user;
      document.getElementById('sendOrderBtn').style.display = user ? 'inline-block' : 'none';
      document.getElementById('crossOutletSearchBtn').style.display = user ? 'inline-block' : 'none';
      document.getElementById('loginBtn').textContent = user ? 'تسجيل الخروج' : 'تسجيل الدخول';

      if (user) {
        const doc = await db.collection("users").doc(user.uid).get();
        userWarehouse = doc.data()?.warehouse ?? "";
        userMall = doc.data()?.mall ?? "";

        document.getElementById('userInfo').textContent = `مرحباً بك في معرض ${userMall}`;

        // ✅ ترتيب التحميل الصحيح
        await loadLocalCatalog();
        await loadSalesByOutlet();   // ✅ الجديد
        rebuildDataForWarehouse(userWarehouse);

        populateFilters();
        await loadFirstSeen();
        renderProducts();
        resetLogoutTimer();
      } else {
        cart = {};
        userWarehouse = "";
        userMall = "";
        window.data = [];
        document.getElementById('userInfo').textContent = '';
        renderProducts();
      }
    });

    function resetLogoutTimer() {
      clearTimeout(logoutTimer);
      logoutTimer = setTimeout(() => {
        if (currentUser) {
          alert("تم تسجيل الخروج تلقائيًا بعد 15 دقيقة من عدم التفاعل.");
          auth.signOut();
        }
      }, 15 * 60 * 1000);
    }
    ['click', 'mousemove', 'keydown', 'scroll', 'touchstart'].forEach(ev => document.addEventListener(ev, resetLogoutTimer));

    function login() {
      if (currentUser) {
        auth.signOut();
        localStorage.removeItem('savedEmail');
        localStorage.removeItem('savedPassword');
      } else {
        document.getElementById('loginModal').style.display = 'flex';
        loadSavedCredentials();
      }
    }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    function confirmLogin() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      if (email && password) {
        localStorage.setItem('savedEmail', email);
        localStorage.setItem('savedPassword', password);
        auth.signInWithEmailAndPassword(email, password)
          .then(() => closeLoginModal())
          .catch(e => alert("فشل الدخول: " + e.message));
      } else {
        alert("يرجى إدخال البريد وكلمة المرور");
      }
    }
    function loadSavedCredentials() {
      const savedEmail = localStorage.getItem('savedEmail');
      const savedPassword = localStorage.getItem('savedPassword');
      if (savedEmail && savedPassword) {
        document.getElementById('emailInput').value = savedEmail;
        document.getElementById('passwordInput').value = savedPassword;
      }
    }

    function openOrderModal() { if (!currentUser) return alert("يرجى تسجيل الدخول أولاً."); document.getElementById('orderModal').style.display = 'flex'; }
    function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

    async function submitOrder() {
      if (submitting) return;

      if (!currentUser) { alert("يجب تسجيل الدخول."); return; }
      if (!userWarehouse || !userMall) { alert("تعذر تحديد بيانات المستخدم."); return; }
      if (Object.keys(cart).length === 0) { alert("🚫 لا يمكن إرسال طلبية بدون منتجات"); return; }

      const confirmBtn = document.getElementById("confirmOrderBtn");
      submitting = true;
      confirmBtn.disabled = true;
      confirmBtn.textContent = "جاري الإرسال...";

      try {
        const hasExtras = document.getElementById("extraItemsCheckbox").checked;
        const catalog = window.data || [];

        const ordersPayload = Object.entries(cart).map(([code, d]) => {
          const p = catalog.find(x => x.code === code);
          if (p) {
            return { 
  code: p.code,
  gofrugal_code: p.gofrugal_code ?? "",   // ✅ هذا هو السطر المطلوب
  name: p.name,
  alias: d.alias ?? '',
  qty: Number(d.qty) || 0
};

          }
          return { alias: d.alias ?? '', qty: Number(d.qty) || 0 };
        });

        await db.collection("orders").add({
          mall: userMall,
          warehouse: userWarehouse,
          hasExtras,
          userId: currentUser.uid,
          orders: ordersPayload,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        showSuccessModal("✅ تم إرسال الطلبية بنجاح");
        cart = {};
        closeOrderModal();
        renderProducts();
      } catch (err) {
        alert("❌ حدث خطأ أثناء الحفظ");
        console.error(err);
      } finally {
        submitting = false;
        confirmBtn.disabled = false;
        confirmBtn.textContent = "تأكيد الطلبية";
      }
    }

    function showSuccessModal(message) {
      const modal = document.createElement('div');
      modal.style.cssText = `position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.2); z-index: 9999; text-align: center; font-size: 18px; color: #2ecc71;`;
      modal.textContent = message;
      document.body.appendChild(modal);
      setTimeout(() => modal.remove(), 3000);
    }

    function populateFilters() {
      const categories = [...new Set((window.data || []).map(d => d.category))];
      document.getElementById('categoryFilter').innerHTML =
        '<option value="">الكل</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderProducts() {
      document.getElementById('loadingSpinner').classList.add('active');

      const category = document.getElementById('categoryFilter').value;
      const priceRange = document.getElementById('priceFilter').value;
      const sortBy = document.getElementById('sortFilter').value;
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      const newOnly = document.getElementById('newOnly')?.checked;

      filteredProducts = (window.data || []).filter(d =>
        d.stock > 20 &&
        (!category || d.category === category) &&
        (!searchTerm
          || (d.alias && String(d.alias).toLowerCase().includes(searchTerm))
          || String(d.code).toLowerCase().includes(searchTerm)
          || String(d.name).toLowerCase().includes(searchTerm)) &&
        filterByPrice(d.price, priceRange) &&
        (!newOnly || isNewArrival(d.code))
      );

      sortProducts(sortBy);
      renderPage(1);
      updateTotalSales();

      setTimeout(() => {
        document.getElementById('loadingSpinner').classList.remove('active');
      }, 500);
    }

    function filterByPrice(price, range) {
      if (!range) return true;
      if (range === '200+') return price >= 200;
      const [min, max] = range.split('-').map(Number);
      return price >= min && price < max;
    }

    function sortProducts(sortBy) {
      switch (sortBy) {
        case 'price-asc': filteredProducts.sort((a, b) => a.price - b.price); break;
        case 'price-desc': filteredProducts.sort((a, b) => b.price - a.price); break;
        case 'sales-desc':
          filteredProducts.sort((a, b) => getSalesInMall(b.code) - getSalesInMall(a.code));
          break;
        case 'stock-desc': filteredProducts.sort((a, b) => b.stock - a.stock); break;
        case 'alias-asc':
          filteredProducts.sort((a, b) => {
            const aAlias = isNaN(Number(a.alias)) ? 0 : Number(a.alias);
            const bAlias = isNaN(Number(b.alias)) ? 0 : Number(b.alias);
            return aAlias - bAlias;
          });
          break;
        case 'alias-desc':
          filteredProducts.sort((a, b) => {
            const aAlias = isNaN(Number(a.alias)) ? 0 : Number(a.alias);
            const bAlias = isNaN(Number(b.alias)) ? 0 : Number(b.alias);
            return bAlias - aAlias;
          });
          break;
      }
    }

    function renderPage(page) {
      currentPage = page;
      const start = (page - 1) * productsPerPage;
      const end = start + productsPerPage;
      const productsToShow = filteredProducts.slice(start, end);

      document.getElementById('productContainer').innerHTML =
        productsToShow.map(d => `
      <div class="product card-wrap">
        ${isNewArrival(d.code) ? '<div class="badge-new">جديد</div>' : ''}
        <img
          loading="lazy"
          data-code="${d.code}"
          data-alias="${d.alias ?? ''}"
          data-gofrugal="${d.gofrugal_code ?? ''}"
          src=""
          alt="${d.name}"
          class="loading"
          onclick="showProductDetails('${d.code}')"
          onload="this.classList.remove('loading')"
          onerror="handleSmartImageFallback(this)"
        >

        <h4>${d.name}</h4>
        <p>السعر: ${d.price} ريال</p>
        <p><strong>الكود:</strong> ${d.code}</p>
        <p><strong>Alias:</strong> ${d.alias ?? '—'}</p>
        <p style="color:#e67e22;font-weight:bold;">المبيعات الإجمالية: ${d.sales || 0}</p>

        <!-- ✅ هنا الإصلاح الحقيقي -->
        <p style="color:#27ae60;font-weight:bold;">المبيعات في هذا المعرض: ${getSalesInMall(d.code)}</p>

        <p><strong>الكمية المتوفرة في المستودع:</strong> ${d.stock ?? '—'}</p>
        <p><strong>الكمية الموجودة في المعرض:</strong> ${d.branches?.[userMall] ?? 0}</p>
        <input type="number" min="1" placeholder="الكمية المطلوبة"
               value="${cart[d.code]?.qty ?? ''}"
               onchange="addToCart('${d.code}', '${d.name}', this.value)">
      </div>
    `).join('');

      renderPagination();

      setTimeout(() => {
        document.querySelectorAll('img[data-alias]').forEach(img => {
          handleSmartImageFallback(img);
        });
      }, 0);
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredProducts.length / productsPerPage);
      let options = '';
      for (let i = 1; i <= totalPages; i++) {
        options += `<option value="${i}" ${i === currentPage ? 'selected' : ''}>${i}</option>`;
      }
      document.getElementById('pagination').innerHTML = `
        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>السابق</button>
        اختر صفحة <select onchange="goToPage(this.value)">${options}</select>
        <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>التالي</button>`;
    }
    function changePage(page) { if (page > 0 && page <= Math.ceil(filteredProducts.length / productsPerPage)) renderPage(page); }
    function goToPage(page) { renderPage(Number(page)); }

    function addToCart(code, name, qty) {
      const product = (window.data || []).find(p => p.code === code);
      if (qty && parseInt(qty) > 0) {
        cart[code] = { name, alias: product?.alias ?? '', qty };
      } else {
        delete cart[code];
      }
    }

    function updateTotalSales() {
      const total = filteredProducts.reduce((sum, p) => sum + getSalesInMall(p.code), 0);
      const count = filteredProducts.length;
      const category = document.getElementById('categoryFilter').value;
      const label = category ? `إجمالي الكميات المباعة لتصنيف "${category}"` : "إجمالي الكميات المباعة للمنتجات المعروضة";
      document.getElementById("totalSales").textContent = `${label}: ${total.toLocaleString()} من ${count} منتج`;
    }

    function showProductDetails(code) {
      const product = (window.data || []).find(p => p.code === code);
      if (!product) return;

      const modal = document.getElementById('productModal');
      const modalImage = document.getElementById('modalProductImage');
      const modalName = document.getElementById('modalProductName');
      const modalDetails = document.getElementById('modalProductDetails');

      modalName.textContent = product.name;

      modalImage.className = 'modal-image loading';
      modalImage.dataset.code = product.code;
      modalImage.dataset.alias = product.alias ?? '';
      modalImage.dataset.gofrugal = product.gofrugal_code ?? '';
      modalImage.src = 'images/placeholder.png';

      modalImage.onload = () => modalImage.classList.remove('loading');
      modalImage.onerror = () => handleSmartImageFallback(modalImage);

      modalDetails.innerHTML = `
    <p><strong>السعر:</strong> ${product.price} ريال</p>
    <p><strong>الكود:</strong> ${product.code}</p>
    <p><strong>Alias:</strong> ${product.alias || '—'}</p>
    <p style="color:#e67e22;font-weight:bold;">المبيعات الإجمالية: ${product.sales || 0}</p>

    <!-- ✅ هنا الإصلاح -->
    <p style="color:#27ae60;font-weight:bold;">المبيعات في هذا المعرض: ${getSalesInMall(product.code)}</p>

    <p><strong>الكمية في المستودع:</strong> ${product.stock}</p>
    <p><strong>الكمية في المعرض:</strong> ${product.branches?.[userMall] ?? 0}</p>
    <p><strong>التصنيف:</strong> ${product.category}</p>
    <div style="margin-top:15px;">
      <input id="modalQtyInput" type="number" min="1" placeholder="الكمية المطلوبة">
      <button onclick="addModalQtyToCart('${product.code}','${product.name}','${product.alias ?? ''}')">
        إضافة للسلة
      </button>
    </div>
  `;

      modal.style.display = 'flex';
    }

    function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }
    document.getElementById('productModal').addEventListener('click', function (e) { if (e.target === this) closeProductModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeProductModal(); });

    function exportToExcel() {
      const products = filteredProducts.map(p => ({
        'اسم المنتج': p.name,
        'السعر': p.price,
        'الكود': p.code,
        'Alias': p.alias || '',
        'الكمية المباعة': p.sales || 0,
        'الكمية المتوفرة': p.stock,
        'التصنيف': p.category
      }));
      const ws = XLSX.utils.json_to_sheet(products);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "المنتجات");
      XLSX.writeFile(wb, "المنتجات.xlsx");
    }

    function shareProduct(code) {
      const product = (window.data || []).find(p => p.code === code);
      if (!product) return;
      const shareText = `منتج: ${product.name}\nالسعر: ${product.price} ريال\nالكود: ${product.code}`;
      if (navigator.share) {
        navigator.share({ title: product.name, text: shareText }).catch(console.error);
      } else {
        navigator.clipboard.writeText(shareText).then(() => alert('تم نسخ معلومات المنتج')).catch(console.error);
      }
    }

    function handleBarcodeInput(event) {
      if (event.key === 'Enter') {
        let barcode = event.target.value.replace(/\D/g, '').trim();
        if (!barcode) return;
        if (barcode.length < 6) barcode = barcode.padStart(6, '0');
        const product = data.find(p => {
          const cleanInput = barcode.replace(/^0+/, '');
          const cleanCode = String(p.code).replace(/^0+/, '');
          return cleanInput === cleanCode && p.outlet === userWarehouse;
        });
        if (product) showProductDetails(product.code);
        else alert('لم يتم العثور على المنتج');
        event.target.value = '';
      }
    }

    function addModalQtyToCart(code, name, alias) {
      const qty = document.getElementById('modalQtyInput').value;
      if (!qty || isNaN(qty) || Number(qty) < 1) { alert('يرجى إدخال كمية صحيحة'); return; }
      cart[code] = { name, alias, qty: Number(qty) };
      closeProductModal();
      renderProducts();
    }

    function openCustomProductModal() {
      document.getElementById('customAliasInput').value = '';
      document.getElementById('customQtyInput').value = '';
      document.getElementById('customProductModal').style.display = 'flex';
    }
    function closeCustomProductModal() { document.getElementById('customProductModal').style.display = 'none'; }

    function submitCustomProduct() {
      const alias = document.getElementById('customAliasInput').value.trim();
      const qty = parseInt(document.getElementById('customQtyInput').value);
      if (!alias) { alert("يرجى إدخال رقم Alias"); return; }
      if (!qty || qty < 1) { alert("يرجى إدخال كمية صحيحة"); return; }
      const code = "custom-" + alias;
      cart[code] = { alias, qty };
      alert(`✅ تمت إضافة المنتج بالـ Alias: ${alias}`);
      closeCustomProductModal();
      renderProducts();
    }
  </script>

  <script>
    function handleSmartImageFallback(img) {
      if (img.dataset.tried === "1") return;
      img.dataset.tried = "1";

      const alias = (img.dataset.alias || "").trim();
      const code = (img.dataset.code || "").trim();
      const gofrugal = (img.dataset.gofrugal || "").trim();

      // Build candidates list: code -> alias -> gofrugal
      let candidates = [];
      [code, alias, gofrugal].forEach(c => {
        if (c) {
          candidates.push(c);
          if (c.toUpperCase().startsWith("KIT-")) {
            candidates.push(c.substring(4));
          }
        }
      });
      
      // Deduplicate
      candidates = [...new Set(candidates)];

      const extensions = [".jpg", ".jpeg", ".png", ".webp", ".JPG", ".JPEG", ".PNG", ".WEBP"];
      const attempts = [];

      candidates.forEach(c => {
        extensions.forEach(ext => {
           attempts.push(`images/${c}${ext}`);
        });
      });

      attempts.push("noimage.png");

      let index = 0;
      const tryNext = () => {
        if (index >= attempts.length) {
          img.classList.add("error");
          img.title = "الصورة غير متوفرة";
          return;
        }
        img.src = attempts[index++];
      };

      img.onerror = tryNext;
      tryNext();
    }
  </script>

  <!-- نافذة تسجيل الدخول -->
  <div id="loginModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
    <div
      style="background:white; padding:20px; border-radius:10px; width:300px; text-align:center; box-shadow: 0 0 15px rgba(0,0,0,0.3);">
      <h3 style="color:#e67e22;">تسجيل الدخول</h3>
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني"
        style="width:90%; padding:8px; margin:8px 0; border:1px solid #ccc; border-radius:5px;"><br>
      <input id="passwordInput" type="password" placeholder="كلمة المرور"
        style="width:90%; padding:8px; margin:8px 0; border:1px solid #ccc; border-radius:5px;"><br>
      <button onclick="confirmLogin()"
        style="background:#e67e22; color:white; padding:8px 16px; border:none; border-radius:5px;">دخول</button>
      <button onclick="closeLoginModal()"
        style="background:gray; color:white; padding:8px 16px; border:none; border-radius:5px; margin-top:5px;">إلغاء</button>
    </div>
  </div>
</body>
